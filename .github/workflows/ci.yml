name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Only the Linux client is built here; the macOS app is not built for this
# repository.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: LinuxViewer (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: LinuxViewer
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libx11-dev libxcb1-dev libasound2-dev libpipewire-0.3-dev libclang-dev clang pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LinuxViewer

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: linuxviewer-${{ github.sha }}
          path: LinuxViewer/target/release/linuxviewer
          retention-days: 14
