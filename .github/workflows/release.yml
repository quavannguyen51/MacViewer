name: Release

# Only the Linux client is published here: the macOS app is not built for
# this repository.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  linux-release:
    name: Build & publish LinuxViewer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libx11-dev libxcb1-dev libasound2-dev libpipewire-0.3-dev libclang-dev clang pkg-config dpkg-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LinuxViewer

      - name: Test
        run: cargo test
        working-directory: LinuxViewer

      - name: Package
        env:
          LINUXVIEWER_VERSION: ${{ env.VERSION }}
        run: scripts/package_linux.sh

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ env.PRERELEASE }}
          fail_on_unmatched_files: true
          files: |
            dist/linux/linuxviewer-${{ env.VERSION }}-x86_64.tar.gz
            dist/linux/linuxviewer_${{ env.VERSION }}_amd64.deb
            dist/linux/SHA256SUMS-linux.txt
